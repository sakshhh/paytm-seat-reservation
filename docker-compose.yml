# Local run identical to the deployed image:  docker compose up --build
# then:  ADMIN_KEY=dev-admin-key ./burst.sh http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
      POSTGRES_DB: seats
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats"]
      interval: 2s
      retries: 30
    ports: ["5432:5432"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://seats:seats@db:5432/seats
      JWT_SECRET: dev-only-secret-change-me
      ADMIN_KEY: dev-admin-key
      DB_POOL_MAX: "20"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
